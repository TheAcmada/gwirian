<!doctype html>
<html lang="en">
  <head>
    <title>Page Not Found (404) - Gwirian</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: rgb(255, 255, 255);
        color: rgb(55, 53, 47);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
        font-size: 16px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: rgb(25, 25, 25);
          color: rgba(255, 255, 255, 0.9);
        }
      }

      .container {
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }

      .logo-section {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 3rem;
      }

      .logo-section img {
        height: 1.5rem;
        width: 1.5rem;
      }

      @media (prefers-color-scheme: dark) {
        .logo-section img {
          filter: brightness(1.5) invert(1);
        }
      }

      .logo-section span {
        font-size: 1rem;
        font-weight: 500;
        color: rgb(55, 53, 47);
      }

      @media (prefers-color-scheme: dark) {
        .logo-section span {
          color: rgba(255, 255, 255, 0.9);
        }
      }

      .error-code {
        font-size: 4rem;
        font-weight: 600;
        line-height: 1;
        color: rgb(120, 119, 116);
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }

      @media (prefers-color-scheme: dark) {
        .error-code {
          color: rgba(255, 255, 255, 0.6);
        }
      }

      .error-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: rgb(55, 53, 47);
        margin-bottom: 0.75rem;
        line-height: 1.3;
      }

      @media (prefers-color-scheme: dark) {
        .error-title {
          color: rgba(255, 255, 255, 0.9);
        }
      }

      .error-message {
        font-size: 1rem;
        color: rgb(120, 119, 116);
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      @media (prefers-color-scheme: dark) {
        .error-message {
          color: rgba(255, 255, 255, 0.6);
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.375rem 0.75rem;
        font-size: 0.875rem;
        font-weight: 500;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 75ms;
        text-decoration: none;
        color: rgb(55, 53, 47);
        background: rgba(55, 53, 47, 0.08);
      }

      .btn:hover {
        background: rgba(55, 53, 47, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        .btn {
          color: rgba(255, 255, 255, 0.9);
          background: rgba(255, 255, 255, 0.08);
        }

        .btn:hover {
          background: rgba(255, 255, 255, 0.16);
        }
      }

      .btn-primary {
        background: rgb(55, 53, 47);
        color: white;
      }

      .btn-primary:hover {
        background: rgb(80, 78, 72);
        color: white;
      }

      @media (prefers-color-scheme: dark) {
        .btn-primary {
          background: rgb(255, 255, 255);
          color: rgb(55, 53, 47);
        }

        .btn-primary:hover {
          background: rgb(235, 235, 235);
          color: rgb(55, 53, 47);
        }
      }

      @media (max-width: 640px) {
        .error-code {
          font-size: 3rem;
        }

        .error-title {
          font-size: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-section">
        <img src="/logo.svg" alt="Gwirian" />
        <span>Gwirian</span>
      </div>
      
      <div class="error-code">404</div>
      
      <h1 class="error-title">Page Not Found</h1>
      
      <p class="error-message">
        The page you were looking for doesn't exist. You may have mistyped the address or the page may have moved.
      </p>
      
      <a href="/" class="btn btn-primary">Go home</a>
    </div>
  </body>
</html>
